<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PLONK — проверка браузера</title>
<style>
  body{margin:0;padding:40px 24px;font:17px/1.5 -apple-system,system-ui,sans-serif;background:#F5F4F0;color:#141E19}
  .row{padding:14px 16px;margin:10px 0;border-radius:14px;background:#fff;font-weight:600}
  .ok{color:#0B7A4E} .bad{color:#C0392B}
</style>
</head>
<body>
  <h1 style="margin:0 0 16px;font-size:24px">Проверка браузера</h1>
  <!-- 1. Если видно эту строку — страница дошла и отрисовалась -->
  <div class="row ok">1. Страница показывается ✓</div>
  <!-- 2. Скрипт заменит текст -->
  <div class="row bad" id="js">2. Скрипты НЕ работают ✗</div>
  <!-- 3. Скрипт-модуль, как у сайта -->
  <div class="row bad" id="mod">3. Модули НЕ работают ✗</div>
  <!-- 4. Запрос к серверу, как сайт берёт данные -->
  <div class="row bad" id="net">4. Запросы к серверу — проверяем…</div>
  <!-- 5. Файл стилей сайта: если он не грузится, сайт стоит белым -->
  <div class="row bad" id="css">5. Стили сайта — проверяем…</div>
  <div class="row" id="ua" style="font-weight:400;font-size:13px;color:#5B6B63"></div>
  <script>
    document.getElementById('js').className = 'row ok'
    document.getElementById('js').textContent = '2. Скрипты работают ✓'
    document.getElementById('ua').textContent = navigator.userAgent
    var report = function (k, v) { try { navigator.sendBeacon('/api/client-log', JSON.stringify({ kind: 'tg-test', url: k + '=' + v, ua: navigator.userAgent, errors: [] })) } catch (e) {} }
    var t0 = Date.now()
    fetch('/api/categories?lang=ru').then(function (r) {
      var el = document.getElementById('net'); el.className = 'row ' + (r.ok ? 'ok' : 'bad')
      el.textContent = '4. Запросы к серверу: ' + r.status + ' за ' + (Date.now() - t0) + ' мс ' + (r.ok ? '✓' : '✗'); report('net', r.status)
    }).catch(function (e) { document.getElementById('net').textContent = '4. Запросы к серверу НЕ проходят ✗ ' + e; report('net', 'fail ' + e) })
    // файл стилей сайта: берём его адрес с главной и пробуем скачать
    fetch('/').then(function (r) { return r.text() }).then(function (html) {
      var m = html.match(/\/assets\/index-[^"']+\.css/)
      if (!m) { document.getElementById('css').textContent = '5. Не нашёл файл стилей'; return }
      var t1 = Date.now()
      return fetch(m[0]).then(function (r) { return r.text().then(function (txt) {
        var el = document.getElementById('css'); el.className = 'row ' + (r.ok ? 'ok' : 'bad')
        el.textContent = '5. Стили сайта: ' + r.status + ', ' + Math.round(txt.length / 1024) + ' КБ за ' + (Date.now() - t1) + ' мс ' + (r.ok ? '✓' : '✗'); report('css', r.status + '/' + (Date.now() - t1) + 'ms')
      }) })
    }).catch(function (e) { document.getElementById('css').textContent = '5. Стили сайта НЕ скачались ✗ ' + e; report('css', 'fail ' + e) })
    report('js', 'ok')
  </script>
  <script type="module">
    document.getElementById('mod').className = 'row ok'
    document.getElementById('mod').textContent = '3. Модули работают ✓'
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <script>
  // nginx уже шлёт index.html с Cache-Control: no-store, но мобильный
  // Safari всё равно иногда показывает старый снимок страницы при
  // возврате по истории или из свёрнутой вкладки — вообще без
  // обращения к серверу. Заголовки тут бессильны: запроса не
  // происходит, серверу нечего запретить кэшировать. Единственный
  // надёжный способ — сделать адрес каждый раз новым: с другим
  // query-параметром браузер не сможет подставить старый снимок,
  // обязан сходить в сеть за настоящей страницей. Проверенное решение
  // (тот же приём уже стоит в другом проекте) — once на вкладку, не в
  // цикл, и через location.replace, не через обычный переход: не
  // плодит лишнюю запись в истории браузера, кнопка «назад» ведёт
  // туда же, что и раньше.
  (function () {
    try {
      var u = new URL(location.href);
      if (!u.searchParams.has('_v')) {
        u.searchParams.set('_v', Date.now().toString(36));
        location.replace(u.toString());
      }
    } catch (e) {}
  })();
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0E9F6E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLONK" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>Барахолка Сербии — объявления в Белграде на русском | PLONK</title>
  <meta name="description" content="Барахолка и доска объявлений в Сербии на русском языке. Купить и продать б/у вещи, технику, мебель, детские товары в Белграде, Нови-Саде и Нише. Бесплатное размещение, без посредников." />

  <!-- Превью при отправке ссылки в мессенджеры и соцсети -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PLONK" />
  <meta property="og:title" content="Барахолка Сербии — объявления в Белграде на русском" />
  <meta property="og:description" content="Купить и продать б/у вещи, технику, мебель в Белграде и по всей Сербии. Бесплатное размещение объявлений, без посредников." />
  <!-- полный адрес: по относительному пути мессенджеры картинку не находят -->
  <meta property="og:image" content="https://plonk.rs/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://plonk.rs/" />
  <meta name="twitter:image" content="https://plonk.rs/og-cover.png" />
  <meta property="og:locale" content="ru_RS" />
  <meta property="og:locale:alternate" content="en_RS" />
  <meta property="og:locale:alternate" content="sr_RS" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Главный адрес сайта. Без него поисковик считает plonk.rs и
       www.plonk.rs разными сайтами и делит между ними вес. -->
  <link rel="canonical" href="https://plonk.rs/" />

  <!-- Сайт на трёх языках: показываем поисковику каждый, иначе он
       решит, что это один русский, и не покажет сербам сербскую
       версию. -->
  <!-- Языковых адресов у сайта нет: язык переключается в самом
       приложении, страница остаётся та же. Три hreflang на один и тот
       же адрес поисковику ничего не сообщают — по его правилам это
       значит «версий нет», — поэтому оставляем только x-default: он
       честно говорит, что страница одна и подходит любому языку. -->
  <link rel="alternate" hreflang="x-default" href="https://plonk.rs/" />

  <!-- Что это за сайт, на понятном поисковику языке: так он покажет
       нас в ответ на «объявления Белград», а не просто по названию. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "PLONK",
    "alternateName": ["Барахолка Сербии", "Объявления Белград", "PLONK Serbia"],
    "url": "https://plonk.rs/",
    "description": "Барахолка и доска объявлений в Сербии на русском языке: Белград, Нови-Сад, Ниш. Купить и продать б/у вещи, технику, мебель, детские товары без посредников",
    "inLanguage": ["ru", "en", "sr"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://plonk.rs/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Отдельно — сам сервис и где он работает: города поисковик
       читает как факт, а не как слова в тексте, и это то, что
       связывает нас с запросами вида «барахолка Нови-Сад». -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineBusiness",
    "name": "PLONK",
    "url": "https://plonk.rs/",
    "logo": "https://plonk.rs/logo-mark.png",
    "description": "Барахолка и доска бесплатных объявлений для русскоязычных в Сербии",
    "areaServed": [
      { "@type": "City", "name": "Белград" },
      { "@type": "City", "name": "Нови-Сад" },
      { "@type": "City", "name": "Ниш" },
      { "@type": "Country", "name": "Сербия" }
    ],
    "availableLanguage": ["ru", "en", "sr"]
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

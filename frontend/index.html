<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#0E9F6E" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLONK" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>PLONK — объявления в Белграде и Сербии</title>
  <meta name="description" content="PLONK — доска объявлений и барахолка в Сербии: Белград, Нови-Сад и другие города. Покупайте и продавайте без посредников на русском, английском и сербском." />

  <!-- Превью при отправке ссылки в мессенджеры и соцсети -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PLONK" />
  <meta property="og:title" content="PLONK — объявления в Белграде и Сербии" />
  <meta property="og:description" content="Доска объявлений и барахолка в Сербии: Белград, Нови-Сад и другие города. RU · EN · SR" />
  <!-- полный адрес: по относительному пути мессенджеры картинку не находят -->
  <meta property="og:image" content="https://plonk.rs/og-cover.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://plonk.rs/" />
  <meta name="twitter:image" content="https://plonk.rs/og-cover.png" />
  <meta property="og:locale" content="ru_RS" />
  <meta property="og:locale:alternate" content="en_RS" />
  <meta property="og:locale:alternate" content="sr_RS" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Главный адрес сайта. Без него поисковик считает plonk.rs и
       www.plonk.rs разными сайтами и делит между ними вес. -->
  <link rel="canonical" href="https://plonk.rs/" />

  <!-- Сайт на трёх языках: показываем поисковику каждый, иначе он
       решит, что это один русский, и не покажет сербам сербскую
       версию. -->
  <link rel="alternate" hreflang="ru" href="https://plonk.rs/" />
  <link rel="alternate" hreflang="en" href="https://plonk.rs/" />
  <link rel="alternate" hreflang="sr" href="https://plonk.rs/" />
  <link rel="alternate" hreflang="x-default" href="https://plonk.rs/" />

  <!-- Что это за сайт, на понятном поисковику языке: так он покажет
       нас в ответ на «объявления Белград», а не просто по названию. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "PLONK",
    "url": "https://plonk.rs/",
    "description": "Доска объявлений и барахолка в Сербии: Белград, Нови-Сад и другие города, на русском, английском и сербском",
    "inLanguage": ["ru", "en", "sr"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://plonk.rs/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

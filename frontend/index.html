<!DOCTYPE html>
<html lang="sr">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <!-- Здесь стоял скрипт, дописывавший к адресу ?_v=<время> и делавший
       переход на новый адрес. Ставился против устаревших снимков
       страницы в Safari при возврате по истории.

       Убран: он лечил одно, ломая три. При каждом первом заходе шёл
       лишний переход с повторной загрузкой; ссылки, которые люди
       копируют из адресной строки и шлют друг другу, содержали мусорный
       хвост; поисковик, исполняющий скрипты, видел переход на адрес,
       отличный от канонического.

       Правильный способ — событие возврата из снимка (pageshow с
       признаком persisted), оно и обрабатывается в приложении
       (см. App.jsx). Адрес при этом не меняется. -->
  <!-- Без maximum-scale: он запрещал увеличивать страницу пальцами.
       Ставят его обычно, чтобы Safari не увеличивал экран при вводе в
       поле, но платит за это человек, которому нужно разглядеть мелкий
       текст или фото. Против увеличения при вводе есть честный способ —
       шрифт в полях не меньше 16px, он и так соблюдён (см. styles.css). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
  <meta name="theme-color" content="#F5F4F0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PLONK" />
  <!-- Предсоединение к Google: кнопку входа рисует их скрипт, и пока
       он едет, на экране пустое место. Рукопожатие с их сервером
       начинается сразу с загрузкой страницы, а не в момент, когда до
       скрипта дошла очередь — это секунда-полторы на неспешной сети. -->
  <link rel="preconnect" href="https://accounts.google.com" crossorigin />
  <link rel="dns-prefetch" href="https://accounts.google.com" />
  <link rel="icon" href="/favicon.ico" sizes="any" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <title>PLONK — oglasi u Beogradu i Srbiji | srpski, ruski, engleski</title>
  <meta name="description" content="Besplatni oglasi u Srbiji na srpskom, ruskom i engleskom. Kupite i prodajte polovne stvari, tehniku, nameštaj, dečje stvari u Beogradu, Novom Sadu i Nišu. Objavljivanje bez posrednika." />

  <!-- Превью при отправке ссылки в мессенджеры и соцсети -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="PLONK" />
  <meta property="og:title" content="PLONK — oglasi u Beogradu i Srbiji" />
  <meta property="og:description" content="Kupite i prodajte polovne stvari, tehniku, nameštaj u Beogradu i širom Srbije. Besplatni oglasi, bez posrednika — na srpskom, ruskom i engleskom." />
  <!-- полный адрес: по относительному пути мессенджеры картинку не находят -->
  <meta property="og:image" content="https://plonk.rs/og-cover.png?v=2" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta property="og:url" content="https://plonk.rs/" />
  <meta name="twitter:image" content="https://plonk.rs/og-cover.png?v=2" />
  <!-- Коды в виде «язык_СТРАНА» из списка, который понимают соцсети.
       Было ru_RS и en_RS — таких сочетаний в списке нет, и разборщик
       либо пропускает их, либо откатывается к своему умолчанию. Сербский
       sr_RS существует, русский пишется ru_RU, английский en_US. -->
  <meta property="og:locale" content="sr_RS" />
  <meta property="og:locale:alternate" content="ru_RU" />
  <meta property="og:locale:alternate" content="en_US" />
  <meta name="twitter:card" content="summary_large_image" />

  <!-- Главный адрес сайта. Без него поисковик считает plonk.rs и
       www.plonk.rs разными сайтами и делит между ними вес. -->
  <link rel="canonical" href="https://plonk.rs/" />

  <!-- Сайт на трёх языках: показываем поисковику каждый, иначе он
       решит, что это один русский, и не покажет сербам сербскую
       версию. -->
  <!-- Языковые адреса у сайта появились (/en/, /sr/), поэтому здесь
       снова полный набор — для главной. Для остальных страниц свои
       ссылки отдаёт сервер вместе с готовым текстом (см. seo.py):
       этот файл один на все адреса, и прописать в нём верные ссылки
       для каждой страницы нельзя. -->
  <link rel="alternate" hreflang="sr" href="https://plonk.rs/" />
  <link rel="alternate" hreflang="ru" href="https://plonk.rs/ru/" />
  <link rel="alternate" hreflang="en" href="https://plonk.rs/en/" />
  <link rel="alternate" hreflang="x-default" href="https://plonk.rs/" />

  <!-- Что это за сайт, на понятном поисковику языке: так он покажет
       нас в ответ на «объявления Белград», а не просто по названию. -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "WebSite",
    "name": "PLONK",
    "alternateName": ["Барахолка Сербии", "Объявления Белград", "PLONK Serbia"],
    "url": "https://plonk.rs/",
    "description": "Барахолка и доска объявлений в Сербии на русском языке: Белград, Нови-Сад, Ниш. Купить и продать б/у вещи, технику, мебель, детские товары без посредников",
    "inLanguage": ["ru", "en", "sr"],
    "potentialAction": {
      "@type": "SearchAction",
      "target": "https://plonk.rs/search?q={search_term_string}",
      "query-input": "required name=search_term_string"
    }
  }
  </script>

  <!-- Отдельно — сам сервис и где он работает: города поисковик
       читает как факт, а не как слова в тексте, и это то, что
       связывает нас с запросами вида «барахолка Нови-Сад». -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "OnlineBusiness",
    "name": "PLONK",
    "url": "https://plonk.rs/",
    "logo": "https://plonk.rs/logo-mark.png",
    "description": "Барахолка и доска бесплатных объявлений для русскоязычных в Сербии",
    "areaServed": [
      { "@type": "City", "name": "Белград" },
      { "@type": "City", "name": "Нови-Сад" },
      { "@type": "City", "name": "Ниш" },
      { "@type": "Country", "name": "Сербия" }
    ],
    "availableLanguage": ["ru", "en", "sr"]
  }
  </script>
  <!-- Мост Telegram для публикатора в боте: он сообщает, кто открыл
       окно, и умеет закрывать его по кнопке «вернуться в чат».
       Грузится только внутри Telegram, на обычном сайте ничего не
       делает и весит полтора килобайта. -->
  <!-- Скрипт Telegram нужен только внутри Telegram (мини-приложение): обычным посетителям сайт не тянет чужой
       скрипт — меньше внешнего кода на странице, меньше поводов у проверок Safe Browsing. -->
  <!-- Только для настоящего мини-приложения (в адресе есть tgWebAppData). Раньше скрипт грузился в любом окне
       Telegram, в том числе при открытии обычной ссылки на объявление, — и встроенный браузер Telegram на iPhone мог
       остаться на белом экране. -->
  <script>if(/tgWebAppData|tgWebAppPlatform/.test(location.hash+location.search)){document.write('<script src="https://telegram.org/js/telegram-web-app.js"><\/script>')}</script>
  <!-- Страховка от белого экрана: ошибки до запуска сайта запоминаем и отправляем на сервер (журнал plonk), а если
       через 8 секунд страница всё ещё пустая — показываем, что делать, вместо белого листа. -->
  <script>
    (function () {
      var errs = [];
      function rec(m) { try { errs.push(String(m).slice(0, 300)) } catch (e) {} }
      window.addEventListener('error', function (e) { rec((e.message || 'error') + ' @ ' + (e.filename || (e.target && (e.target.src || e.target.href)) || '') + ':' + (e.lineno || '')) }, true);
      window.addEventListener('unhandledrejection', function (e) { rec('promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason)) });
      setTimeout(function () {
        var root = document.getElementById('root');
        if (root && !document.getElementById('boot')) return;
        try { navigator.sendBeacon('/api/client-log', JSON.stringify({ kind: 'blank', url: location.href, ua: navigator.userAgent, errors: errs })) } catch (e) {}
        var ru = /\/ru(\/|$)/.test(location.pathname) || /^ru/.test(navigator.language || '');
        root.innerHTML = '<div style="max-width:420px;margin:90px auto;padding:0 24px;font:16px/1.5 -apple-system,system-ui,sans-serif;text-align:center;color:#141E19">'
          + '<div style="font-size:20px;font-weight:800;margin-bottom:10px">' + (ru ? 'Страница не загрузилась' : 'Stranica se nije učitala') + '</div>'
          + '<div style="color:#5B6B63;margin-bottom:20px">' + (ru ? 'Попробуйте обновить или открыть в браузере.' : 'Pokušajte ponovo ili otvorite u pregledaču.') + '</div>'
          + '<a href="' + location.href + '" style="display:inline-block;padding:12px 22px;border-radius:14px;background:#CDEFE0;color:#085041;font-weight:800;text-decoration:none">' + (ru ? 'Обновить' : 'Osveži') + '</a></div>';
      }, 8000);
    })();
  </script>
</head>
<body>
  <!-- Заставка до запуска сайта: виден логотип, а не пустой (в тёмной теме — чёрный) экран. React при запуске
       заменяет её содержимым. Если скрипты не запустились (так бывает во встроенном браузере Telegram на iPhone),
       через 5 с появляется кнопка «Открыть в Safari». -->
  <div id="root"><div class="boot" id="boot">
    <style>
      .boot{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:#F5F4F0;color:#141E19;font:600 16px/1.4 -apple-system,system-ui,sans-serif;text-align:center;padding:24px}
      .boot b{font-size:30px;font-weight:900;letter-spacing:-1px}
      .boot i{width:26px;height:26px;border-radius:50%;border:3px solid rgba(15,163,106,.25);border-top-color:#0FA36A;animation:bootspin .8s linear infinite}
      .boot a{display:inline-block;visibility:hidden;margin-top:10px;padding:12px 22px;border-radius:14px;background:#CDEFE0;color:#085041;font-weight:800;text-decoration:none;animation:bootshow 0s 5s forwards}
      @keyframes bootspin{to{transform:rotate(360deg)}} @keyframes bootshow{to{visibility:visible}}
      @media (prefers-color-scheme: dark){.boot{background:#1E2421;color:#EEF2EF}}
    </style>
    <b>PLONK</b><i></i>
    <a id="boot-safari" href="x-safari-https://plonk.rs/">Открыть в Safari / Otvori u Safariju</a>
    <script>try{document.getElementById('boot-safari').href='x-safari-https://plonk.rs'+location.pathname+location.search}catch(e){}</script>
  </div></div>
  <noscript>
    <!-- Сайт собирается в браузере, и без скриптов человек видел пустоту.
         Пусть хотя бы понимает, что происходит и куда идти. -->
    <div style="max-width:520px;margin:80px auto;padding:0 24px;font:16px/1.5 system-ui,-apple-system,sans-serif;color:#141E19;text-align:center;">
      <h1 style="font-size:22px;margin:0 0 12px;">PLONK — oglasi u Srbiji</h1>
      <p style="margin:0 0 20px;color:#5B6B63;">
        Za rad sajta potreban je JavaScript — uključite ga u podešavanjima
        pregledača i osvežite stranicu.
      </p>
      <!-- Сербский — язык страницы по умолчанию (html lang="sr"): раньше
           здесь был только русский текст, и поисковик видел сербскую
           страницу на чужом языке. Русский и английский — строкой ниже. -->
      <p lang="ru" style="margin:0 0 8px;color:#5B6B63;font-size:14px;">Для работы сайта нужен JavaScript.</p>
      <p lang="en" style="margin:0 0 20px;color:#5B6B63;font-size:14px;">This site needs JavaScript to run.</p>
      <p style="margin:0;color:#5B6B63;">
        Telegram:
        <a href="https://t.me/Baraholka_Plonk" style="color:#0FA36A;">@Baraholka_Plonk</a>
      </p>
    </div>
  </noscript>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>

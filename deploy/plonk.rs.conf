# PLONK на plonk.rs
#
# Сайт и картинки под одним именем: до этого страницы открывались по
# одному порту, а снимки отдавались с другого — браузер ругался на
# смешение, а ссылки в объявлениях расходились.

# Куда вести по User-Agent: поисковика/мессенджер — на бэкенд (готовый
# текст для превью и индексации), человека — на SPA. Раньше это было
# написано через `if` внутри location с proxy_pass — в nginx это
# известная ловушка: proxy_pass не императивная команда, а настройка,
# и безусловная строка ниже перекрывала условную для абсолютно всех
# запросов. Ни один бот на самом деле не долетал до бэкенда — вся
# SEO/превью-разметка в приложении просто никогда не отдавалась.
# map — штатный способ выбирать бэкенд по заголовку без этой ловушки.
# Отдельный признак «это поисковик» — нужен там, где человеку отдаётся
# файл, а не прокси: выбрать между статикой и бэкендом одним $seo_backend
# уже нельзя.
# Applebot в списке нарочно отсутствует: он собран на WebKit и исполняет
# JavaScript, то есть видит обычный сайт таким же, каким его видит Safari.
# Отдавать ему отдельную страницу — значит показывать роботу Apple одно, а
# людям в Safari другое: это и есть подмена содержимого, один из главных
# признаков мошеннического сайта в классификаторе Safari.
map $http_user_agent $is_crawler {
    default 0;
    "~*(googlebot|yandex|bingbot|duckduckbot|baiduspider|facebookexternalhit|twitterbot|telegrambot|whatsapp|slackbot|linkedinbot|petalbot)" 1;
}

map $http_user_agent $seo_backend {
    # Порт приложения, а не прежний vite preview: короткие ссылки /go/
    # уходили на мёртвый порт и отдавали 502.
    default                 "127.0.0.1:8002";
    "~*(googlebot|yandex|bingbot|duckduckbot|baiduspider|facebookexternalhit|twitterbot|telegrambot|whatsapp|slackbot|linkedinbot|petalbot)"
                             "127.0.0.1:8002";
}

server {
    listen 80;
    server_name plonk.rs www.plonk.rs;

    # Проверка для обновления сертификата — до перенаправления, иначе
    # обновить его будет нечем.
    location /.well-known/acme-challenge/ { root /var/www/html; }
    # Ссылку «plonk.rs» без https:// Telegram открывает как http://, и после перенаправления 301 его встроенный
    # браузер на iPhone оставлял белый экран (с полным адресом https:// всё открывалось). Людям отдаём маленькую
    # страницу-переход: мгновенный meta refresh (работает и без скриптов) + переход скриптом + видимая ссылка.
    # Поисковикам и ботам — по-прежнему настоящий 301, адрес сайта для них не меняется.
    location / {
        if ($is_crawler) { return 301 https://plonk.rs$request_uri; }
        default_type text/html;
        add_header Cache-Control "no-store" always;
        return 200 '<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="refresh" content="0;url=https://plonk.rs$request_uri"><link rel="canonical" href="https://plonk.rs$request_uri"><title>PLONK</title><script>location.replace("https://plonk.rs"+location.pathname+location.search+location.hash)</script></head><body style="font:600 17px -apple-system,system-ui,sans-serif;text-align:center;padding:80px 24px;background:#F5F4F0;color:#141E19"><p>PLONK</p><a href="https://plonk.rs$request_uri" style="color:#0FA36A">https://plonk.rs</a></body></html>';
    }
}

server {
    listen 443 ssl http2;
    server_name www.plonk.rs;

    ssl_certificate     /etc/letsencrypt/live/plonk.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plonk.rs/privkey.pem;

    # Один адрес вместо двух: иначе поисковики считают их разными
    # сайтами, а вход по ссылке из бота работает только на одном.
    return 301 https://plonk.rs$request_uri;
}

server {
    listen 443 ssl http2;
    server_name plonk.rs;

    ssl_certificate     /etc/letsencrypt/live/plonk.rs/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plonk.rs/privkey.pem;

    # Объявления бывают с пятью снимками по мегабайту.
    client_max_body_size 25m;

    # Заголовки, по которым сайт выглядит настоящим, а не прокладкой:
    # HSTS, nosniff, запрет встраивания в чужую рамку, Referrer-Policy.
    # Вынесены в отдельный файл и подключаются также в каждом location
    # со своим add_header — иначе там они пропадают (так устроен nginx).
    include /etc/nginx/snippets/plonk-headers.inc;

    # Снимки объявлений отдаёт приложение.
    # Сжатие. Само gzip on задано глобально в nginx.conf, здесь только
    # список типов: по умолчанию nginx сжимает лишь HTML, а весь вес —
    # в JS и в ответах API. Собранный JS весит 780 КБ, сжатый — 240: на
    # мобильном интернете это разница между «открылось» и «крутится».
    #
    # Повторять здесь «gzip on» нельзя — nginx считает это переопределением
    # директивы в том же контексте и отказывается запускаться (поймали
    # при первом раскате).
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/manifest+json;

    # Установщики приложения (.ipa) сайт больше не раздаёт — их отдаёт GitHub (см. backend/app/core/app_updates.py:
    # GITHUB_IPA). Скачивание установщиков «в обход App Store» с сайта объявлений — признак, по которому Safe Browsing
    # помечает сайт как обманный.
    location ^~ /api/app-updates/ { return 410; }  # всё о приложении (источник SideStore, сборки, обновления) — только на GitHub

    # Фото и видео — сам nginx с диска: он отвечает на запросы частей файла (Range, ответ 206). Раньше файлы шли
    # через приложение (Starlette 0.38 частей не умеет — всегда целиком, 200), а iPhone (AVPlayer в приложении и
    # Safari) без ответа 206 видео не воспроизводит — оттого ролики в приложении не играли. Нет файла на диске
    # (другой каталог в настройках) — как раньше, через приложение, но и там nginx сам вырезает нужную часть.
    location /media/ {
        root /opt/fino/backend;
        try_files $uri @media_app;
        add_header Cache-Control "public, immutable, max-age=2592000";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    location @media_app {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_force_ranges on;
        # Картинки не меняются, поэтому браузер может держать их у себя.
        # Срок пишем прямо здесь, без директивы expires: она шлёт свой
        # Cache-Control, и в ответе их оказывалось два — max-age от неё и
        # public, immutable отсюда. Браузеры берут первый, но два
        # заголовка об одном и том же это просто неряшливо.
        add_header Cache-Control "public, immutable, max-age=2592000";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Подтверждение владения для поисковиков. Файлы лежат отдельно от
    # сайта: сборщик о них не знает и отдал бы вместо них главную
    # страницу — а поисковик такое подтверждением не считает.
    location ~ ^/(google[0-9a-f]+\.html|yandex_[0-9a-f]+\.html)$ {
        root /var/www/verify;
    }

    # Карту сайта собирает приложение: она меняется каждый час вместе
    # с объявлениями, и держать её готовым файлом нельзя.
    location = /sitemap.xml {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
    }

    # Страницы объявлений: поисковику отдаём готовый текст, человеку —
    # обычный сайт.
    #
    # Различаем здесь, а не в приложении: если отправлять человека
    # обратно на тот же адрес, nginx вернёт запрос приложению — и
    # получится кольцо, страница не откроется вовсе.
    # Чужие адреса — честное «нет».
    #
    # Боты стучатся в /wp-admin, /admin/login.php, /.env, /xmlrpc.php и
    # подобное. Мы отвечали «200 ОК» на всё подряд, и это примета
    # подделки: страница входа по адресу чужой админки выглядит как
    # фишинг, а проверяющие смотрят именно на это.
    #
    # Правим здесь, а не на сервере: deploy.sh копирует этот файл поверх
    # настроек при каждом раскате, и ручные правки терялись — так у нас
    # уже пропали и перенаправление со слэша, и этот запрет.
    location ~* [.](php|asp|aspx|jsp|cgi|env|sql|bak|log|ini|conf)$ { return 404; }
    location ~* ^/(wp-admin|wp-login|wp-content|wp-includes|xmlrpc|administrator|phpmyadmin|cpanel|vendor|server-status|cgi-bin) { return 404; }
    location ~ /\.(env|git|aws|ssh|svn) { return 404; }

    # security.txt — стандартный адрес, по которому исследователи (и
    # автоматические проверки репутации) ищут, кому сообщать об
    # уязвимости. У мошеннических сайтов его не бывает.
    location = /.well-known/security.txt {
        root /opt/fino/frontend/dist;
        add_header Content-Type "text/plain; charset=utf-8";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Адрес со слэшем на конце ведём на адрес без него: иначе у
    # объявления два живых адреса, и поисковик считает их копиями.
    location ~ "^((/(en|sr|ru))?/[a-z-]+/[a-z0-9-]+/[a-z0-9-]+-[0-9a-f]{8})/$" {
        return 301 https://$host$1;
    }

    # Короткий путь по ключу — для ссылок из бота и админки, где
    # понятного адреса взять неоткуда.
    location ~ ^/go/ {
        proxy_pass http://$seo_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Страницы разделов: /c/mebel. По разделу («мебель Белград») ищут
    # чаще, чем по отдельной вещи, а поисковик видел там пустую
    # страницу приложения. Поисковику отдаём готовый список объявлений
    # со ссылками, человеку — обычный сайт. Различаем тем же способом,
    # что и у объявлений: по $seo_backend выше.
    location ~ "^(/(en|sr|ru))?/c/[a-z0-9-]+/?$" {
        # Поисковику — готовый текст с бэкенда, человеку — приложение
        # файлом с диска. Через return и именованный блок, а не через if
        # с proxy_pass: там proxy_pass не команда, а настройка, и
        # безусловная строка перекрыла бы условную — эта ловушка уже
        # ломала SEO однажды (см. комментарий к map выше).
        if ($is_crawler) { return 418; }
        error_page 418 = @seo_backend_pass;
        root /opt/fino/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Понятный адрес объявления: /beograd/mebel/stol-ikea-45e17e58.
    # Узнаём по хвосту из восьми знаков — у прочих страниц такого нет.
    location ~ "^(/(en|sr|ru))?/[a-z-]+/[a-z0-9-]+/[a-z0-9-]+-[0-9a-f]{8}/?$" {
        # Поисковику — готовый текст с бэкенда, человеку — приложение
        # файлом с диска. Через return и именованный блок, а не через if
        # с proxy_pass: там proxy_pass не команда, а настройка, и
        # безусловная строка перекрыла бы условную — эта ловушка уже
        # ломала SEO однажды (см. комментарий к map выше).
        if ($is_crawler) { return 418; }
        error_page 418 = @seo_backend_pass;
        root /opt/fino/frontend/dist;
        try_files $uri /index.html;
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Видео с телефона — больше общего лимита 25 МБ: шопс до 150 МБ, видео к объявлению до 80 МБ.
    # Отдаём в бэкенд потоком, без буфера на диске nginx, — бэкенд пишет файл по частям.
    location ~ ^/api/(shops/upload|media/upload-video)$ {
        client_max_body_size 160m;
        proxy_request_buffering off;
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Перенос объявлений и разбор нейросетью идут долго, а живой
        # чат (WebSocket) должен держаться часами, не разрываясь в
        # паузах молчания между сообщениями.
        proxy_read_timeout 3600s;
        # WebSocket (живой чат) — без этих трёх строк nginx не пропустит
        # запрос на повышение соединения до ws, отдаст обычный HTTP-ответ
        # вместо открытия сокета. На обычные HTTP-запросы эти заголовки
        # никак не влияют — $http_upgrade у них просто пустой.
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Собранные JS/CSS — имя файла содержит хэш содержимого
    # (index-B2kCAWl8.js): поменялся код — поменялось имя. Значит один
    # и тот же адрес физически не может отдать разное содержимое,
    # и держать файл в кэше можно бессрочно, не оглядываясь на сервер
    # при каждой загрузке.
    location /assets/ {
        root /opt/fino/frontend/dist;
        # Год — и без директивы expires, чтобы Cache-Control не
        # дублировался (см. /media/ выше).
        add_header Cache-Control "public, immutable, max-age=31536000";
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Куда уходит запрос поисковика из маршрутов выше.
    location @seo_backend_pass {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Всё остальное — сам сайт, файлами с диска.
    #
    # Раньше страницы шли через vite preview на порту 5173. Это сервер
    # для предпросмотра сборки, а не для боевой нагрузки: один процесс
    # на JavaScript отдаёт каждый файл каждому посетителю. nginx делает
    # ровно то же в разы дешевле и умеет отдавать сжатое.
    # Промо-материалы (ролик, обложка). /promo/dl/<файл> — тот же файл, но «скачать»: на iPhone Safari
    # иначе просто играет видео, и сохранить его некуда. Без кэша — после пересборки ролика сразу новый.
    location ^~ /promo/ {
        root /opt/fino/frontend/dist;
        add_header Cache-Control "no-cache";
        include /etc/nginx/snippets/plonk-headers.inc;
        location ~ ^/promo/dl/(?<promo_file>[A-Za-z0-9._-]+)$ {
            alias /opt/fino/frontend/dist/promo/$promo_file;
            add_header Content-Disposition 'attachment; filename="$promo_file"';
            add_header Cache-Control "no-cache";
            include /etc/nginx/snippets/plonk-headers.inc;
        }
    }

    location / {
        # Сначала — готовый файл с диска, кому бы он ни был нужен.
        #
        # Раньше развилка «робот или человек» стояла первой, и робот за
        # robots.txt, og-cover.png, иконками и картинками разделов уходил
        # в приложение, а то отвечало «страницы нет». Google не видел ни
        # правил robots.txt, ни ссылки на карту сайта, а у главной в
        # превью Telegram не было картинки. Теперь файл отдаётся всем
        # одинаково, а развилка — только для адресов страниц.
        #
        # $uri/ здесь нет намеренно: иначе «/» нашёлся бы как папка и
        # робот получил бы пустое приложение вместо главной с текстом.
        root /opt/fino/frontend/dist;
        try_files $uri @page;
        include /etc/nginx/snippets/plonk-headers.inc;
    }

    # Адрес страницы: поисковику — готовый текст с бэкенда (там же честное
    # «страницы нет» для несуществующих адресов, см. not_found в seo.py),
    # человеку — приложение. Любой адрес приложения — один и тот же
    # index.html: разбирает его уже React Router в браузере.
    location @page {
        if ($is_crawler) { return 418; }
        error_page 418 = @seo_backend_pass;
        root /opt/fino/frontend/dist;
        rewrite ^ /index.html break;
        # index.html — единственное, что называется одинаково при любой
        # сборке и при этом меняется (в нём — новое имя JS-файла). Ему
        # нельзя застревать в кэше телефона ни на секунду: no-store.
        add_header Cache-Control "no-store";
        include /etc/nginx/snippets/plonk-headers.inc;
    }
}

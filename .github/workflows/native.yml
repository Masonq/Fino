# Нативное приложение PLONK (React Native, Expo) — пока для владельца.
# Номер версии растёт с каждой сборкой (1.0.N) — по нему SideStore видит обновление в «источнике» plonk.rs.
# Сам запускается при нативных правках в native/; вручную — Actions → «Нативное приложение» → Run workflow.
# Результат: выпуск native-latest с plonk-native.ipa (открыть в SideStore) и plonk-native.apk (поставить на Android).
name: Нативное приложение

on:
  workflow_dispatch:
  push:
    branches: [main]
    # Полная сборка .ipa/.apk — только при нативных изменениях (зависимости, настройки, иконки).
    # Правки экранов и логики уходят обновлением (native-update.yml) — без переустановки.
    paths:
      - 'native/app.json'
      - 'native/package.json'
      - 'native/package-lock.json'
      - 'native/assets/**'
      - '.github/workflows/native.yml'

permissions:
  contents: write

concurrency:
  group: native-build
  cancel-in-progress: true

env:
  CI: '1'
  EXPO_NO_TELEMETRY: '1'

jobs:
  android:
    runs-on: ubuntu-latest
    # Однажды шаг Gradle висел 6 часов до таймаута GitHub — жёсткий предел, чтобы не жечь минуты
    timeout-minutes: 40
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Нативный проект Android
        run: set -o pipefail; npx expo prebuild --platform android --no-install 2>&1 | tee ../build-android-prebuild.log
      # Только arm64 — это все современные телефоны. Без x86 и x86_64 (эмуляторы) и 32-битного armeabi-v7a APK
      # был 103 МБ и собирался 30 минут.
      - name: Сборка APK (JS внутри, подпись отладочным ключом — для своего телефона)
        timeout-minutes: 30
        run: |
          # Если хранилище зависимостей разово не ответило (так было с kotlin-stdlib) — вторая попытка, а не падение
          set -o pipefail; cd android
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a 2>&1 | tee ../../build-android.log \
            || { sleep 20; ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=arm64-v8a 2>&1 | tee -a ../../build-android.log; }
      - name: Лог сборки — в выпуск native-build-log (если упало)
        if: failure() || cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-build-log
          name: Лог упавшей сборки нативного приложения
          prerelease: true
          make_latest: false
          files: build-android*.log
      - run: cp android/app/build/outputs/apk/release/app-release.apk ../plonk-native.apk
      - name: В выпуск native-latest (сам, не дожидаясь другой платформы)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: PLONK — нативное приложение (тестовая сборка)
          prerelease: true
          make_latest: false
          body: "iPhone: plonk-native.ipa — в SideStore (источник https://plonk.rs/api/app-updates/sidestore.json). Android: plonk-native.apk."
          files: plonk-native.apk

  ios:
    # Expo SDK 56+ требует Xcode 26.4 или новее (на macos-15 был 26.3 — модули Expo не компилировались)
    runs-on: macos-26
    timeout-minutes: 35
    defaults:
      run:
        working-directory: native
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '^26.4'
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: native/package-lock.json
      - run: npm ci
      - name: Нативный проект iOS
        run: set -o pipefail; npx expo prebuild --platform ios 2>&1 | tee ../build-ios-prebuild.log
      - name: Сборка без подписи (подписывает SideStore твоим Apple ID)
        timeout-minutes: 25
        run: >
          set -o pipefail; xcodebuild -workspace ios/PLONK.xcworkspace -scheme PLONK -configuration Release
          -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build
          MARKETING_VERSION=1.0.${{ github.run_number }} CURRENT_PROJECT_VERSION=${{ github.run_number }}
          CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee ../build-ios.log > /dev/null
      - name: Лог сборки — в выпуск native-build-log (если упало)
        if: failure() || cancelled()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-build-log
          name: Лог упавшей сборки нативного приложения
          prerelease: true
          make_latest: false
          files: build-ios*.log
      - name: Упаковка в IPA
        run: mkdir -p ../ipa/Payload && cp -R build/Build/Products/Release-iphoneos/PLONK.app ../ipa/Payload/ && cd ../ipa && zip -qry ../plonk-native.ipa Payload
      - name: В выпуск native-latest (сам, не дожидаясь другой платформы)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: native-latest
          name: PLONK — нативное приложение (тестовая сборка)
          prerelease: true
          make_latest: false
          body: "iPhone: plonk-native.ipa — в SideStore (источник https://plonk.rs/api/app-updates/sidestore.json). Android: plonk-native.apk."
          files: plonk-native.ipa

